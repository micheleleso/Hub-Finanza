<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<link rel="manifest" href="manifest.webmanifest">
<title>Hub Finanza</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Palette Dark Fintech: sfondo #0b0f19, superfici #111827, accento menta #29FFC2
  tailwind.config = { theme: { extend: { colors: { bg:'#0b0f19', surf:'#111827', mint:'#29FFC2' } } } };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<style>
  :root{color-scheme:dark}
  html{background:#0b0f19}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
  .tabular{font-variant-numeric:tabular-nums}
  /* Barra mobile: fissa in basso, con area sicura (notch / barra gesti) */
  #botnav{z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  /* Il contenuto lascia sempre spazio sotto: barra (~60px) + tasto + area sicura */
  #view{padding-bottom:calc(9rem + env(safe-area-inset-bottom))}
  /* Tasto flottante: sempre sopra la barra mobile */
  #fab{z-index:40;right:1rem;bottom:calc(4.75rem + env(safe-area-inset-bottom))}
  @media (min-width:768px){
    #view{padding-bottom:4rem}
    #fab{right:2rem;bottom:2rem}
  }
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#1e293b;border-radius:8px}
</style>
</head>
<body class="bg-bg text-slate-100">

<!-- Login (solo con Supabase configurato) -->
<div id="auth" class="hidden fixed inset-0 z-[70] bg-bg items-center justify-center p-6"></div>

<!-- Sidebar desktop -->
<aside class="hidden md:flex fixed inset-y-0 left-0 w-60 flex-col border-r border-slate-800 bg-surf p-4 z-20">
  <div class="text-lg font-semibold mb-6"><span class="text-mint">●</span> Hub Finanza</div>
  <nav id="sidenav" class="space-y-1"></nav>
  <div id="sidefoot" class="mt-auto text-xs text-slate-500 leading-relaxed"></div>
</aside>

<div class="md:pl-60"><main id="view" class="max-w-4xl mx-auto px-4 pt-6"><p class="text-sm text-slate-500">Caricamento… (v2.4)</p></main></div>

<!-- Barra di navigazione mobile -->
<nav id="botnav" class="md:hidden fixed bottom-0 inset-x-0 grid grid-cols-4 border-t border-slate-800 bg-surf"></nav>

<!-- Tasto flottante + -->
<button id="fab" onclick="txForm('expense')" aria-label="Nuova transazione"
  class="fixed h-14 w-14 rounded-full bg-mint text-bg text-3xl font-light shadow-[0_8px_24px_rgba(41,255,194,.35)] hover:brightness-110">+</button>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 items-end md:items-center justify-center"></div>
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[60] rounded-xl bg-mint text-bg font-medium text-sm px-4 py-2"></div>

<script>
/* ===================== STATO & UTILITÀ ===================== */
/* =====================================================================
   CONFIGURAZIONE SUPABASE: incolla URL e ANON KEY (Project Settings -> API).
   Se restano vuote l'app gira in modalità demo con localStorage.
   ===================================================================== */
const SUPABASE_URL = 'https://ddfeeqybmxladzunkpbg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_F3q51ck3EEkWZ8dfPHiyWg_HkwpiRBW';
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;
let sb;
const APP_VERSION = '2.4';
// Qualsiasi errore di JavaScript viene mostrato in una barra rossa (niente più pagina muta)
function showFatal(m){
  let b = document.getElementById('fatal');
  if (!b){ b = document.createElement('div'); b.id = 'fatal'; b.className = 'fixed top-0 inset-x-0 z-[90] bg-red-600 text-white text-sm p-3'; document.body.appendChild(b); }
  b.textContent = 'Errore: ' + m;
}
window.addEventListener('error', e => showFatal(e.message));
window.addEventListener('unhandledrejection', e => showFatal((e.reason && e.reason.message) || String(e.reason)));
const LS_KEY = 'hub_finanza_demo';
const now = new Date();
const pad = n => String(n).padStart(2,'0');
let S = {accounts:[], categories:[], transactions:[]}, chart;
// Filtri Transazioni (mese '' = tutti i mesi) e Analisi (sempre un mese preciso)
const V = {tab:'dash', m:pad(now.getMonth()+1), y:String(now.getFullYear()), type:'', acc:'', q:''};
const A = {m:pad(now.getMonth()+1), y:String(now.getFullYear())};
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const TABS = [['dash','Dashboard','🏠'],['tx','Transazioni','↔️'],['an','Analisi','📊'],['pat','Patrimonio','🗓️']];
const TYPE_LBL = {income:'Entrata', expense:'Uscita', transfer:'Trasferimento', refund:'Rimborso'};
const ACC_LBL = {cash:'Contanti', card:'Carta', savings:'Risparmio', investment:'Investimenti'};
const CARD = 'bg-surf rounded-2xl border border-slate-800 p-4';
const IN = 'w-full rounded-xl border border-slate-800 bg-bg px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-mint focus:border-mint';
const B1 = 'rounded-xl bg-mint text-bg px-4 py-2.5 text-sm font-semibold hover:brightness-110';
const B2 = 'rounded-xl border border-slate-800 bg-surf px-3 py-2 text-xs font-medium text-slate-200 hover:border-mint/60';
const SEG_ON = 'bg-surf text-mint border border-mint/40', SEG_OFF = 'text-slate-400 border border-transparent';
const DEFAULT_CATS = [
  {name:'Stipendio', type:'income',  icon:'💼', color:'#29FFC2', monthly_budget:null},
  {name:'Altre entrate', type:'income', icon:'💰', color:'#14b8a6', monthly_budget:null},
  {name:'Spesa',     type:'expense', icon:'🛒', color:'#818cf8', monthly_budget:400},
  {name:'Casa',      type:'expense', icon:'🏠', color:'#38bdf8', monthly_budget:null},
  {name:'Trasporti', type:'expense', icon:'🚌', color:'#94a3b8', monthly_budget:80},
  {name:'Ristoranti',type:'expense', icon:'🍕', color:'#f59e0b', monthly_budget:120},
  {name:'Svago',     type:'expense', icon:'🎬', color:'#f472b6', monthly_budget:100},
  {name:'Salute',    type:'expense', icon:'💊', color:'#f87171', monthly_budget:null},
];
const $ = s => document.querySelector(s);
const eur = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d+'T00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
// UUID v4 valido anche in contesti non sicuri (http://IP), dove crypto.randomUUID non esiste
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x' ? r : (r&3|8)).toString(16); });
const acc = id => S.accounts.find(a => a.id === id);
const cat = id => S.categories.find(c => c.id === id);
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2600); };

/* Saldo = saldo iniziale + entrate + rimborsi − uscite ± trasferimenti */
function balance(a){
  let b = +a.initial_balance || 0;
  for (const t of S.transactions){
    const x = +t.amount;
    if (t.account_id === a.id) b += (t.type==='income' || t.type==='refund') ? x : -x; // uscita e trasferimento in uscita
    if (t.type==='transfer' && t.to_account_id === a.id) b += x;
  }
  return b;
}

/* ===================== DATI: localStorage con salvataggio automatico ===================== */
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(S));

function seed(){
  const d = n => new Date(Date.now()-n*864e5).toISOString().slice(0,10);
  const AC = [['Portafoglio','cash',120,'#29FFC2'],['Carta Principale','card',1500,'#818cf8'],
              ['Conto Deposito','savings',5000,'#38bdf8'],['Broker','investment',3000,'#f59e0b']]
    .map(([name,type,initial_balance,color]) => ({id:uid(),name,type,initial_balance,color}));
  const C = DEFAULT_CATS.map(c => ({id:uid(),...c}));
  const a = n => AC.find(x=>x.name===n).id, c = n => C.find(x=>x.name===n).id;
  const t = (type,ac,ca,amount,n,description,is_necessary=null,to=null) => ({
    id:uid(), type, account_id:a(ac), to_account_id:to?a(to):null, category_id:ca?c(ca):null, amount,
    is_necessary, date:d(n), description, notes:null, tags:[], created_at:new Date(Date.now()-n*864e5).toISOString()});
  return {accounts:AC, categories:C, transactions:[
    t('income','Carta Principale','Stipendio',1800,2,'Stipendio'),
    t('expense','Carta Principale','Spesa',64.3,1,'Spesa settimanale',true),
    t('expense','Carta Principale','Svago',22,1,'Cinema',false),
    t('expense','Portafoglio','Ristoranti',18.5,0,'Pizza con amici',false),
    t('transfer','Carta Principale',null,300,3,'Risparmio mensile',null,'Conto Deposito'),
    t('refund','Carta Principale','Spesa',9.9,0,'Reso prodotto')]};
}
async function load(){
  if (DEMO){
    try { const raw = localStorage.getItem(LS_KEY); S = raw ? JSON.parse(raw) : seed(); }
    catch { S = seed(); }
    return save();
  }
  const r = await Promise.all(['accounts','categories','transactions'].map(n => sb.from(n).select('*').order('created_at')));
  const bad = r.find(x => x.error);
  if (bad) return toast('Errore database: ' + bad.error.message);
  S = {accounts:r[0].data, categories:r[1].data, transactions:r[2].data};
  if (!S.categories.length){                       // primo accesso: categorie di default
    const {data} = await sb.from('categories').insert(DEFAULT_CATS).select();
    S.categories = data || [];
  }
}
// Le scritture sono ottimistiche (la UI si aggiorna subito) e accodate, così i conti
// vengono salvati prima delle transazioni che li usano.
let Q = Promise.resolve();
function ins(table,row){
  row.id = uid(); row.created_at = new Date().toISOString(); S[table].push(row);
  if (DEMO) return save();
  const {created_at, ...payload} = row;
  Q = Q.then(async () => {
    const {error} = await sb.from(table).insert(payload);
    if (error){ S[table] = S[table].filter(x => x.id !== row.id); toast('Salvataggio fallito: ' + error.message); render(); }
  });
}
function resetDemo(){
  if (confirm('Ripristinare i dati demo? Le modifiche salvate andranno perse.')){ localStorage.removeItem(LS_KEY); load().then(render); }
}
const foot = () => `v${APP_VERSION} · ` + (DEMO
  ? `Modalità demo: dati solo su questo dispositivo · <button class="underline hover:text-mint" onclick="resetDemo()">Ripristina demo</button>`
  : `Sincronizzato con Supabase · <button class="underline hover:text-mint" onclick="sb.auth.signOut()">Esci</button>` +
    (localStorage.getItem(LS_KEY) && !localStorage.getItem('hub_imported') ? ` · <button class="underline hover:text-mint" onclick="importLocal()">Importa dati locali</button>` : ''));

/* Importa nel database i dati salvati in localStorage su questo browser/indirizzo */
async function importLocal(){
  let L; try { L = JSON.parse(localStorage.getItem(LS_KEY)); } catch { L = null; }
  if (!L) return toast('Nessun dato locale valido');
  if (!confirm(`Importare ${L.accounts.length} conti, ${L.categories.length} categorie e ${L.transactions.length} transazioni nel database?`)) return;
  const idm = {};
  const accs = L.accounts.map(a => { const id = uid(); idm[a.id] = id; return {id, name:a.name, type:a.type, initial_balance:a.initial_balance, color:a.color}; });
  const cats = [];
  L.categories.forEach(c => {
    const ex = S.categories.find(x => x.name === c.name && x.type === c.type);
    if (ex) idm[c.id] = ex.id;
    else { const id = uid(); idm[c.id] = id; cats.push({id, name:c.name, type:c.type, icon:c.icon, color:c.color, monthly_budget:c.monthly_budget}); }
  });
  const txs = L.transactions.map(t => ({id:uid(), type:t.type, account_id:idm[t.account_id], to_account_id:t.to_account_id?idm[t.to_account_id]:null,
    category_id:t.category_id?(idm[t.category_id]||null):null, amount:t.amount, is_necessary:t.is_necessary, date:t.date,
    description:t.description, notes:t.notes, tags:t.tags||[]}));
  try {
    for (const [tb,rows] of [['accounts',accs],['categories',cats],['transactions',txs]]){
      if (!rows.length) continue;
      const {error} = await sb.from(tb).insert(rows); if (error) throw error;
    }
    localStorage.setItem('hub_imported','1'); await load(); render(); toast('Importazione completata');
  } catch (e) { toast('Importazione fallita: ' + e.message); }
}

/* ===================== NAVIGAZIONE & MODALI ===================== */
function nav(){
  const on = k => V.tab === k;
  $('#sidenav').innerHTML = TABS.map(([k,l,i]) => `<button onclick="go('${k}')" class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm border ${on(k)?'bg-mint/10 text-mint border-mint/30 font-medium':'text-slate-400 border-transparent hover:bg-slate-800/60'}"><span>${i}</span>${l}</button>`).join('');
  $('#botnav').innerHTML = TABS.map(([k,l,i]) => `<button onclick="go('${k}')" class="flex flex-col items-center py-2 text-[11px] ${on(k)?'text-mint font-medium':'text-slate-500'}"><span class="text-lg">${i}</span>${l}</button>`).join('');
}
const go = t => { V.tab = t; render(); window.scrollTo(0,0); };
const render = () => { nav(); $('#sidefoot').innerHTML = foot(); ({dash:viewDash, tx:viewTx, an:viewAn, pat:viewPat})[V.tab](); };
function modal(html){
  const m = $('#modal');
  m.innerHTML = `<div class="bg-surf border border-slate-800 w-full md:max-w-md rounded-t-2xl md:rounded-2xl p-5 max-h-[92vh] overflow-y-auto" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))">${html}</div>`;
  m.classList.remove('hidden'); m.classList.add('flex');
  m.onclick = e => { if (e.target === m) closeModal(); };
}
const closeModal = () => { const m=$('#modal'); m.classList.add('hidden'); m.classList.remove('flex'); };

/* Selettore data: due menu a tendina (mese in italiano + anno) */
function dateSel(st, fn, allMonths){
  const maxY = Math.max(2027, now.getFullYear()+1), ys = [];
  for (let y = 2024; y <= maxY; y++) ys.push(String(y));
  if (!ys.includes(st.y)) ys.push(st.y);
  return `<div class="grid grid-cols-2 gap-2">
    <select class="${IN}" aria-label="Mese" onchange="${fn}('m',this.value)">
      ${allMonths ? `<option value="" ${st.m===''?'selected':''}>Tutti i mesi</option>` : ''}
      ${MESI.map((n,i) => { const v = pad(i+1); return `<option value="${v}" ${st.m===v?'selected':''}>${n}</option>`; }).join('')}</select>
    <select class="${IN}" aria-label="Anno" onchange="${fn}('y',this.value)">
      ${ys.sort().map(y => `<option value="${y}" ${st.y===y?'selected':''}>${y}</option>`).join('')}</select></div>`;
}

/* ===================== RIGA MOVIMENTO ===================== */
function row(t, withDel){
  const c = cat(t.category_id), a = acc(t.account_id), b = acc(t.to_account_id);
  const sign = (t.type==='income'||t.type==='refund') ? 1 : t.type==='expense' ? -1 : 0;
  const col = sign>0 ? 'text-mint' : sign<0 ? 'text-slate-100' : 'text-slate-400';
  const badge = t.type==='expense'
    ? (t.is_necessary ? '<span class="rounded-full bg-mint/10 text-mint border border-mint/30 px-2 py-0.5 text-[10px] font-medium">Necessaria</span>'
                      : '<span class="rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/30 px-2 py-0.5 text-[10px] font-medium">Casuale</span>') : '';
  const tags = (t.tags||[]).map(x => `<span class="text-[10px] text-slate-500">#${esc(x)}</span>`).join(' ');
  return `<div class="flex items-center gap-3 p-3">
    <div class="h-10 w-10 shrink-0 rounded-full flex items-center justify-center text-lg" style="background:${c?.color||'#94a3b8'}26">${c?.icon || (t.type==='transfer'?'🔁':'💱')}</div>
    <div class="min-w-0 flex-1">
      <div class="truncate text-sm font-medium">${esc(t.description || c?.name || TYPE_LBL[t.type])}</div>
      <div class="truncate text-xs text-slate-400">${esc(a?.name)}${b?' → '+esc(b.name):''} · ${esc(c?.name || TYPE_LBL[t.type])} · ${fmtDate(t.date)}</div>
      <div class="mt-0.5 flex flex-wrap gap-1.5 items-center">${badge}${tags}</div>
    </div>
    <div class="text-right"><div class="tabular text-sm font-semibold ${col}">${sign>0?'+':sign<0?'−':''}${eur(t.amount)}</div>
    ${withDel?`<button onclick="rmTx('${t.id}')" class="text-xs text-slate-500 hover:text-red-400">Elimina</button>`:''}</div></div>`;
}
const sorted = () => [...S.transactions].sort((x,y) => y.date.localeCompare(x.date) || (y.created_at||'').localeCompare(x.created_at||''));
function rmTx(id){
  if (!confirm('Eliminare questa transazione?')) return;
  S.transactions = S.transactions.filter(t => t.id !== id); render();
  if (DEMO) return save();
  Q = Q.then(async () => { const {error} = await sb.from('transactions').delete().eq('id',id); if (error){ toast(error.message); await load(); render(); } });
}

/* ===================== TAB 1 · DASHBOARD ===================== */
function viewDash(){
  const bt = f => S.accounts.filter(f).reduce((s,a) => s + balance(a), 0);
  const cash = bt(a => ['cash','savings'].includes(a.type)), card = bt(a => a.type==='card'), inv = bt(a => a.type==='investment');
  const k = (l,v,s,hi) => `<div class="rounded-2xl p-4 border ${hi?'bg-mint/10 border-mint/50':'bg-surf border-slate-800'}">
    <div class="text-xs ${hi?'text-mint':'text-slate-400'}">${l}</div>
    <div class="mt-1 text-xl font-semibold tabular ${hi?'text-mint':''}">${eur(v)}</div>
    <div class="text-[11px] text-slate-500">${s}</div></div>`;
  const accs = S.accounts.map(a => `<div class="${CARD} flex items-center gap-3">
      <span class="h-3 w-3 rounded-full" style="background:${esc(a.color)}"></span>
      <div class="flex-1 min-w-0"><div class="text-sm font-medium truncate">${esc(a.name)}</div><div class="text-xs text-slate-400">${ACC_LBL[a.type]}</div></div>
      <div class="text-right"><div class="tabular text-sm font-semibold">${eur(balance(a))}</div>
      <button onclick="reconc('${a.id}')" class="text-xs text-mint hover:underline">Riconcilia saldo</button></div></div>`).join('')
    || `<div class="${CARD} text-sm text-slate-400">Nessun conto. <button class="text-mint underline" onclick="newItem('account')">Creane uno</button></div>`;
  const recent = sorted().slice(0,5).map(t => row(t,false)).join('') || '<div class="p-4 text-sm text-slate-400">Nessun movimento.</div>';
  $('#view').innerHTML = `
    <h1 class="text-xl font-semibold mb-4">Dashboard</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${k('Totale Contanti',cash,'cassa + risparmio')}${k('Totale Carte',card,'carte e conti')}
      ${k('Totale Investimenti',inv,'broker')}${k('Patrimonio Totale',cash+card+inv,'somma di tutto',true)}</div>
    <div class="flex items-center justify-between mt-8 mb-3"><h2 class="font-semibold">I miei conti</h2>
      <button class="${B2}" onclick="newItem('account')">+ Conto</button></div>
    <div class="grid md:grid-cols-2 gap-3">${accs}</div>
    <h2 class="font-semibold mt-8 mb-3">Ultimi movimenti</h2>
    <div class="bg-surf rounded-2xl border border-slate-800 divide-y divide-slate-800">${recent}</div>
    <p class="md:hidden mt-8 text-xs text-slate-500 text-center leading-relaxed">${foot()}</p>`;
}

/* Riconciliazione: crea una transazione di rettifica (tag "rettifica") pari alla differenza */
function reconc(id){
  const a = acc(id);
  modal(`<h3 class="font-semibold mb-1">Riconcilia «${esc(a.name)}»</h3>
    <p class="text-sm text-slate-400 mb-4">Saldo calcolato: <b class="text-slate-100">${eur(balance(a))}</b>. Inserisci il saldo reale: verrà creata una rettifica per la differenza.</p>
    <form id="rf" class="space-y-3"><input name="real" inputmode="decimal" placeholder="Saldo reale (€)" class="${IN}" required>
    <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">Riconcilia</button></div></form>`);
  $('#rf').onsubmit = e => {
    e.preventDefault();
    const real = parseFloat(new FormData(e.target).get('real').replace(',','.'));
    if (isNaN(real)) return toast('Importo non valido');
    const diff = real - balance(a);
    if (Math.abs(diff) < 0.005){ closeModal(); return toast('Il saldo coincide già'); }
    ins('transactions', {type:diff>0?'income':'expense', account_id:id, to_account_id:null, category_id:null,
      amount:+Math.abs(diff).toFixed(2), is_necessary:null, date:today(), description:'Rettifica saldo', notes:null, tags:['rettifica']});
    closeModal(); render();
  };
}

/* ===================== TAB 2 · TRANSAZIONI ===================== */
function viewTx(){
  $('#view').innerHTML = `
    <div class="flex items-center justify-between mb-4"><h1 class="text-xl font-semibold">Transazioni</h1>
      <div class="flex gap-2"><button class="${B2}" onclick="newItem('account')">+ Conto</button><button class="${B2}" onclick="newItem('category')">+ Categoria</button></div></div>
    <div class="space-y-2 mb-4">
      ${dateSel(V,'setTx',true)}
      <div class="grid grid-cols-2 gap-2">
        <select class="${IN}" onchange="setTx('type',this.value)"><option value="">Tutti i tipi</option>
          ${Object.entries(TYPE_LBL).map(([k,l]) => `<option value="${k}" ${V.type===k?'selected':''}>${l}</option>`).join('')}</select>
        <select class="${IN}" onchange="setTx('acc',this.value)"><option value="">Tutti i conti</option>
          ${S.accounts.map(a => `<option value="${a.id}" ${V.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      <input type="search" placeholder="Cerca descrizione o tag…" value="${esc(V.q)}" class="${IN}" oninput="setTx('q',this.value)"></div>
    <div id="list" class="bg-surf rounded-2xl border border-slate-800 divide-y divide-slate-800"></div>
    <div id="sum" class="text-xs text-slate-500 mt-2 text-right"></div>`;
  renderList();
}
const setTx = (k,v) => { V[k] = v; renderList(); };
function renderList(){
  const q = V.q.trim().toLowerCase(), key = V.m ? `${V.y}-${V.m}` : V.y;
  const list = sorted().filter(t =>
    t.date.startsWith(key) && (!V.type || t.type===V.type) &&
    (!V.acc || t.account_id===V.acc || t.to_account_id===V.acc) &&
    (!q || [t.description, t.notes, cat(t.category_id)?.name, ...(t.tags||[])].join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = list.map(t => row(t,true)).join('') || '<div class="p-6 text-center text-sm text-slate-400">Nessun movimento trovato.</div>';
  $('#sum').textContent = `${list.length} movimenti`;
}

/* Modulo rapido: Entrata / Uscita / Trasferimento / Rimborso */
let T = 'expense';
function txForm(type = T){
  T = type;
  if (!S.accounts.length) return modal(`<p class="text-sm mb-3">Crea prima un conto.</p><button class="${B1}" onclick="newItem('account')">Nuovo conto</button>`);
  const opt = arr => arr.map(x => `<option value="${x.id}">${esc(x.icon||'')} ${esc(x.name)}</option>`).join('');
  const cats = S.categories.filter(c => c.type === (type==='income' ? 'income' : 'expense'));
  const tabs = [['income','Entrata'],['expense','Uscita'],['transfer','Trasf.'],['refund','Rimborso']];
  modal(`<div class="grid grid-cols-4 gap-1 rounded-xl bg-bg p-1 mb-4">${tabs.map(([k,l]) =>
      `<button type="button" onclick="txForm('${k}')" class="rounded-lg py-2 text-xs font-medium ${k===type?SEG_ON:SEG_OFF}">${l}</button>`).join('')}</div>
    <form id="f" class="space-y-3">
      <div><label class="text-xs text-slate-400">${type==='transfer'?'Da conto':'Conto'}</label><select name="account_id" class="${IN}">${opt(S.accounts)}</select></div>
      ${type==='transfer' ? `<div><label class="text-xs text-slate-400">A conto</label><select name="to_account_id" class="${IN}">${opt(S.accounts)}</select></div>` : `
      <div><label class="text-xs text-slate-400">Categoria${type==='refund'?' di spesa da scalare':''}</label>
        <select name="category_id" class="${IN}" required><option value="">—</option>${opt(cats)}</select></div>`}
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-400">Importo (€)</label><input name="amount" inputmode="decimal" required class="${IN}" placeholder="0,00"></div>
        <div><label class="text-xs text-slate-400">Data</label><input type="date" name="date" value="${today()}" required class="${IN}"></div></div>
      ${type==='expense' ? `<label class="flex items-center justify-between rounded-xl bg-bg border border-slate-800 px-3 py-2.5 cursor-pointer">
        <span class="text-sm">Necessaria</span><input type="checkbox" name="is_necessary" checked class="h-5 w-5 accent-[#29FFC2]"
        onchange="this.previousElementSibling.textContent=this.checked?'Necessaria':'Casuale / Desiderio'"></label>` : ''}
      <input name="description" placeholder="Descrizione" class="${IN}">
      <input name="tags" placeholder="Tag separati da virgola" class="${IN}">
      <div class="flex gap-2 pt-1"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">Salva</button></div>
    </form>`);
  $('#f').onsubmit = saveTx;
}
function saveTx(e){
  e.preventDefault();
  const f = new FormData(e.target), type = T;
  const amount = parseFloat(String(f.get('amount')).replace(',','.'));
  if (!(amount > 0)) return toast('Importo non valido');
  const r = {type, account_id:f.get('account_id'), to_account_id:type==='transfer'?f.get('to_account_id'):null,
    category_id:type==='transfer'?null:(f.get('category_id')||null), amount,
    is_necessary:type==='expense'?!!f.get('is_necessary'):null, date:f.get('date'),
    description:f.get('description')||null, notes:null,
    tags:(f.get('tags')||'').split(',').map(s => s.trim().replace(/^#/,'')).filter(Boolean)};
  if (type!=='transfer' && !r.category_id) return toast('Seleziona una categoria');
  if (type==='transfer' && r.account_id===r.to_account_id) return toast('Scegli due conti diversi');
  ins('transactions', r); closeModal(); render();
}

/* Nuovo conto / nuova categoria */
function newItem(kind = 'category'){
  const isAcc = kind === 'account';
  modal(`<div class="grid grid-cols-2 gap-1 rounded-xl bg-bg p-1 mb-4">
      <button type="button" onclick="newItem('account')" class="rounded-lg py-2 text-xs font-medium ${isAcc?SEG_ON:SEG_OFF}">Nuovo conto</button>
      <button type="button" onclick="newItem('category')" class="rounded-lg py-2 text-xs font-medium ${!isAcc?SEG_ON:SEG_OFF}">Nuova categoria</button></div>
    <form id="nf" class="space-y-3"><input name="name" placeholder="Nome" required class="${IN}">
    ${isAcc ? `<select name="type" class="${IN}">${Object.entries(ACC_LBL).map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select>
      <input name="initial_balance" inputmode="decimal" placeholder="Saldo iniziale (€)" class="${IN}">`
    : `<select name="type" class="${IN}"><option value="expense">Uscita</option><option value="income">Entrata</option></select>
      <input name="icon" placeholder="Emoji (es. 🛒)" maxlength="4" class="${IN}">
      <input name="monthly_budget" inputmode="decimal" placeholder="Budget mensile (opzionale)" class="${IN}">`}
    <label class="flex items-center gap-3 text-sm text-slate-400">Colore <input type="color" name="color" value="${isAcc?'#29FFC2':'#818cf8'}" class="h-9 w-14 rounded-lg border border-slate-800 bg-bg"></label>
    <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">Crea</button></div></form>`);
  $('#nf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), num = v => { const n = parseFloat(String(v||'').replace(',','.')); return isNaN(n) ? null : n; };
    const r = isAcc ? {name:f.get('name'), type:f.get('type'), initial_balance:num(f.get('initial_balance'))||0, color:f.get('color')}
                    : {name:f.get('name'), type:f.get('type'), icon:f.get('icon')||'🏷️', color:f.get('color'), monthly_budget:num(f.get('monthly_budget'))};
    ins(isAcc?'accounts':'categories', r); closeModal(); render();
  };
}

/* ===================== TAB 3 · ANALISI MENSILE ===================== */
const setAn = (k,v) => { A[k] = v; viewAn(); };
function viewAn(){
  // Le rettifiche di riconciliazione (tag "rettifica") sono escluse dai KPI
  const key = `${A.y}-${A.m}`;
  const ms = S.transactions.filter(t => t.date.startsWith(key) && !(t.tags||[]).includes('rettifica'));
  const sum = f => ms.filter(f).reduce((s,t) => s + +t.amount, 0);
  const inc = sum(t => t.type==='income'), ex = sum(t => t.type==='expense'), rf = sum(t => t.type==='refund');
  const spese = ex - rf, risp = inc - spese, rate = inc > 0 ? risp/inc*100 : 0;
  const nec = sum(t => t.type==='expense' && t.is_necessary), cas = ex - nec, pn = ex > 0 ? nec/ex*100 : 0;
  const k = (l,v,c='') => `<div class="${CARD}"><div class="text-xs text-slate-400">${l}</div><div class="mt-1 text-xl font-semibold tabular ${c}">${v}</div></div>`;
  $('#view').innerHTML = `
    <div class="mb-4"><h1 class="text-xl font-semibold mb-3">Analisi mensile</h1>${dateSel(A,'setAn',false)}</div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${k('Entrate',eur(inc),'text-mint')}${k('Uscite (nette rimborsi)',eur(spese))}
      ${k('Risparmio',eur(risp),risp<0?'text-red-400':'text-mint')}${k('Tasso di risparmio',rate.toFixed(1)+'%',rate<0?'text-red-400':'')}</div>
    <div class="${CARD} mt-3"><h2 class="font-semibold mb-3">Spese: Necessarie vs Casuali</h2>
      <div class="grid md:grid-cols-2 gap-4 items-center">
        <div class="h-52"><canvas id="ch"></canvas></div>
        <div class="space-y-3 text-sm">
          <div><div class="flex justify-between"><span class="text-slate-300">Necessarie</span><b class="tabular text-mint">${eur(nec)} · ${pn.toFixed(0)}%</b></div>
            <div class="h-2 rounded-full bg-amber-400/20 mt-1"><div class="h-2 rounded-full bg-mint" style="width:${pn}%"></div></div></div>
          <div class="flex justify-between"><span class="text-slate-300">Casuali / Desideri</span><b class="tabular text-amber-300">${eur(cas)} · ${ex>0?(100-pn).toFixed(0):0}%</b></div>
          <p class="text-xs text-slate-500">Rimborsi sottratti dal totale uscite; rettifiche di saldo escluse.</p></div></div></div>`;
  if (chart) chart.destroy();
  Chart.defaults.color = '#94a3b8';
  chart = new Chart($('#ch'), {type:'doughnut',
    data:{labels:['Necessarie','Casuali'], datasets:[{data:ex>0?[nec,cas]:[1,0], backgroundColor:ex>0?['#29FFC2','#f59e0b']:['#1e293b','#1e293b'], borderColor:'#111827', borderWidth:3}]},
    options:{cutout:'70%', maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}}});
}

/* ===================== TAB 4 · PATRIMONIO & CALENDARIO (segnaposto) ===================== */
function viewPat(){
  const ph = (t,d) => `<div class="rounded-2xl border-2 border-dashed border-slate-700 p-8 text-center"><div class="font-medium">${t}</div><p class="text-sm text-slate-400 mt-1">${d}</p></div>`;
  $('#view').innerHTML = `<h1 class="text-xl font-semibold mb-4">Patrimonio &amp; Calendario</h1>
    <div class="grid md:grid-cols-2 gap-3">
      ${ph('📈 Evoluzione del patrimonio','Grafico storico per conto e per tipologia — in arrivo nella prossima fase.')}
      ${ph('🗓️ Calendario','Scadenze, spese ricorrenti e vista a calendario dei movimenti — in arrivo nella prossima fase.')}</div>`;
}

/* ===================== AVVIO ===================== */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===================== LOGIN & AVVIO ===================== */
function showAuth(){
  const a = $('#auth'); a.classList.remove('hidden'); a.classList.add('flex');
  a.innerHTML = `<form id="af" class="w-full max-w-sm space-y-3"><div class="text-2xl font-semibold"><span class="text-mint">●</span> Hub Finanza</div>
    <p class="text-sm text-slate-400">Accedi: i tuoi dati si sincronizzano su tutti i dispositivi.</p>
    <input name="email" type="email" autocomplete="email" placeholder="Email" required class="${IN}">
    <input name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password" required class="${IN}">
    <p id="diag" class="text-xs text-slate-500">Verifica collegamento a Supabase… · versione ${APP_VERSION}</p>
    <p id="amsg" class="hidden text-sm text-mint leading-relaxed"></p>
    <button class="${B1} w-full">Accedi</button><button type="button" id="su" class="${B2} w-full">Crea account</button></form>`;
  // Diagnostica: dice subito se questo browser riesce a raggiungere Supabase (e mostra la versione del file)
  const dg = $('#diag'), host = new URL(SUPABASE_URL).host;
  fetch(SUPABASE_URL + '/auth/v1/health', {headers:{apikey:SUPABASE_ANON_KEY}})
    .then(r => { dg.textContent = `Collegamento a ${host}: ${r.ok ? 'OK' : 'risposta inattesa (' + r.status + ')'} · versione ${APP_VERSION}`; dg.className = 'text-xs ' + (r.ok ? 'text-mint' : 'text-amber-300'); })
    .catch(e => { dg.textContent = `Collegamento a ${host}: NON raggiungibile (${e.message}) · versione ${APP_VERSION}`; dg.className = 'text-xs text-red-400'; });
  const redirect = location.origin + location.pathname;      // il link nella mail riporta qui
  let lastEmail = '';
  const msg = (h, err) => { const m = $('#amsg'); m.innerHTML = h; m.className = 'text-sm leading-relaxed ' + (err ? 'text-red-400' : 'text-mint'); };
  const friendly = m => /anonymous sign-ins/i.test(m) ? 'Inserisci email e password (almeno 6 caratteri) prima di premere il pulsante.'
    : /rate limit/i.test(m) ? 'Troppe email inviate in poco tempo: Supabase ne permette pochissime all\'ora. Attendi un po\' (anche un\'ora) e riprova.'
    : /already registered|already been registered/i.test(m) ? 'Questa email è già registrata: premi Accedi.'
    : /signups? (not allowed|are disabled|disabled)/i.test(m) ? 'Le registrazioni sono disattivate su Supabase (Authentication → Sign In / Providers → "Allow new users to sign up").'
    : /invalid api key|apikey/i.test(m) ? 'Chiave Supabase non valida: controlla SUPABASE_ANON_KEY nel file.'
    : /password/i.test(m) ? 'Password non valida: ' + esc(m)
    : /failed to fetch|networkerror|load failed/i.test(m) ? 'Impossibile raggiungere Supabase. Controlla la connessione, che il progetto non sia in pausa e che nessun blocco (VPN, blocco pubblicità) lo impedisca.'
    : esc(m);
  window.resendMail = async () => {
    const {error} = await sb.auth.resend({type:'signup', email:lastEmail, options:{emailRedirectTo:redirect}});
    msg(error ? friendly(error.message) : 'Email inviata di nuovo. Controlla anche lo spam.', !!error);
  };
  const resendBtn = ' <button type="button" class="underline" onclick="resendMail()">Reinvia email</button>';
  const run = async signup => {
    if (!$('#af').reportValidity()) return;      // il pulsante 'Crea account' non controlla da solo i campi vuoti
    const f = new FormData($('#af')), cred = {email:f.get('email').trim(), password:f.get('password')};
    lastEmail = cred.email; msg('Attendi…');
    try {
      const {data,error} = signup ? await sb.auth.signUp({...cred, options:{emailRedirectTo:redirect}}) : await sb.auth.signInWithPassword(cred);
      if (error){
        if (/not confirmed/i.test(error.message)) return msg('Email non ancora confermata: apri il link nella mail che ti abbiamo inviato.' + resendBtn);
        return msg(friendly(error.message), true);
      }
      if (signup && data.user && data.user.identities && !data.user.identities.length) return msg('Questa email è già registrata: premi Accedi.', true);
      if (!data.session) return msg(`Ti abbiamo inviato una email di conferma a <b>${esc(cred.email)}</b>. Apri il link nella mail, poi torna qui e premi Accedi. Controlla anche lo spam.` + resendBtn);
      a.classList.add('hidden'); a.classList.remove('flex'); boot();
    } catch (e) { msg(friendly(String((e && e.message) || e)), true); }
  };
  $('#af').onsubmit = e => { e.preventDefault(); run(false); };
  $('#su').onclick = () => run(true);
}
async function boot(){
  if (!DEMO && typeof supabase === 'undefined')
    return showFatal('Libreria Supabase non caricata: controlla la connessione a Internet o blocchi del browser verso cdn.jsdelivr.net.');
  if (!DEMO){
    if (!sb){
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT'){ S = {accounts:[],categories:[],transactions:[]}; showAuth(); } });
      // Al ritorno sull'app ricarica i dati (per vedere le modifiche fatte da un altro dispositivo)
      const sync = () => {
        const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
        if (!document.hidden && !typing && $('#modal').classList.contains('hidden')) Q = Q.then(load).then(render);
      };
      document.addEventListener('visibilitychange', sync);
      setInterval(sync, 15000);   // ricarica ogni 15 secondi mentre l'app è aperta
    }
    const {data:{session}} = await sb.auth.getSession();
    if (!session) return showAuth();
  }
  await load(); render();
}
boot();
</script>
