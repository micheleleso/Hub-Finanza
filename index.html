/* Saldo = saldo iniziale + entrate + rimborsi − uscite ± trasferimenti */
// Saldo di un conto a fine del mese `key` (AAAA-MM); senza `key` = oggi, con tutti i movimenti.
// Sui conti Investimenti si conta solo il capitale versato: le rettifiche (plusvalenze non realizzate) sono ignorate.
function balanceAt(a, key){
  const end = key ? key + '-31' : '9999-12-31';
  let b = +a.initial_balance || 0;
  for (const t of S.transactions){
    if (t.date > end) continue;
    if (a.type === 'investment' && (t.tags||[]).includes('rettifica')) continue;
    const x = +t.amount;
    if (t.account_id === a.id) b += (t.type==='income' || t.type==='refund') ? x : -x; // uscita e trasferimento in uscita
    if (t.type==='transfer' && t.to_account_id === a.id) b += x;
  }
  return b;
}
const balance = a => balanceAt(a);

async function load(){
  if (DEMO){
    try { const raw = localStorage.getItem(LS_KEY); S = raw ? JSON.parse(raw) : seed(); }
    catch { S = seed(); }
    S.budget_settings = S.budget_settings || []; S.goals = S.goals || []; S.goal_entries = S.goal_entries || [];
    return save();
  }
  const r = await Promise.all(['accounts','categories','transactions'].map(n => sb.from(n).select('*').order('created_at')));
  const bad = r.find(x => x.error);
  if (bad) return toast('Errore database: ' + bad.error.message);
  const bs = await sb.from('budget_settings').select('*').limit(1);   // se la tabella non esiste ancora: budget non salvabile, ma l'app funziona
  budgetReady = !bs.error;
  const gx = await Promise.all(['goals','goal_entries'].map(n => sb.from(n).select('*').order('created_at')));   // tabelle facoltative finché non si esegue migration_goals.sql
  goalsReady = !gx.some(x => x.error);
  S = {accounts:r[0].data, categories:r[1].data, transactions:r[2].data, budget_settings:bs.error ? [] : bs.data,
       goals:goalsReady ? gx[0].data : [], goal_entries:goalsReady ? gx[1].data : []};
  if (!S.categories.length){                       // primo accesso: categorie di default
    const {data} = await sb.from('categories').insert(DEFAULT_CATS).select();
    S.categories = data || [];
  }
}
// Le scritture sono ottimistiche (la UI si aggiorna subito) e accodate, così i conti
// vengono salvati prima delle transazioni che li usano.
let Q = Promise.resolve();
function ins(table,row){
  row.id = uid(); row.created_at = new Date().toISOString(); S[table].push(row);
  if (DEMO) return save();
  const {created_at, ...payload} = row;
  Q = Q.then(async () => {
    const {error} = await sb.from(table).insert(payload);
    if (error){ S[table] = S[table].filter(x => x.id !== row.id); toast('Salvataggio fallito: ' + error.message); render(); }
  });
}
function upd(table,id,patch){
  const rows = S[table], i = rows.findIndex(x => x.id === id);
  if (i < 0) return toast('Elemento non trovato');
  rows[i] = {...rows[i], ...patch};
  if (DEMO){ save(); render(); return; }
  Q = Q.then(async () => {
    const {error} = await sb.from(table).update(patch).eq('id',id);
    if (error) toast('Modifica non salvata: ' + error.message);
    await load(); render();
  });
}
function del(table,id){
  if (DEMO){ S[table] = S[table].filter(x => x.id !== id); save(); render(); return; }
  Q = Q.then(async () => {
    const {error} = await sb.from(table).delete().eq('id',id);
    if (error) toast('Eliminazione non riuscita: ' + error.message);
    await load(); render();
  });
}
function removeItem(kind,id){
  if (kind === 'account' && S.transactions.some(t => t.account_id === id || t.to_account_id === id))
    return toast('Impossibile eliminare: il conto è usato da una transazione');
  if (kind === 'category' && S.transactions.some(t => t.category_id === id))
    return toast('Impossibile eliminare: la categoria è usata da una transazione');
  const label = kind === 'account' ? 'conto' : 'categoria';
  if (!confirm(`Eliminare questo ${label}?`)) return;
  del(kind === 'account' ? 'accounts' : 'categories',id);
}
function resetDemo(){
  if (confirm('Ripristinare i dati demo? Le modifiche salvate andranno perse.')){ localStorage.removeItem(LS_KEY); load().then(render); }
}
const foot = () => `${!DEMO && currentEmail ? `<div class="mb-1 text-slate-400">${esc(currentEmail)}</div>` : ''}<div>v${APP_VERSION} · ` + (DEMO

/* Importa nel database i dati salvati in localStorage su questo browser/indirizzo */
async function importLocal(){
  let L; try { L = JSON.parse(localStorage.getItem(LS_KEY)); } catch { L = null; }
  if (!L) return toast('Nessun dato locale valido');
  if (!confirm(`Importare ${L.accounts.length} conti, ${L.categories.length} categorie e ${L.transactions.length} transazioni nel database?`)) return;
  const idm = {};
  const accs = L.accounts.map(a => { const id = uid(); idm[a.id] = id; return {id, name:a.name, type:a.type, initial_balance:a.initial_balance, color:a.color}; });
  const cats = [];
  L.categories.forEach(c => {
    const ex = S.categories.find(x => x.name === c.name && x.type === c.type);
    if (ex) idm[c.id] = ex.id;
    else { const id = uid(); idm[c.id] = id; cats.push({id, name:c.name, type:c.type, icon:c.icon, color:c.color, monthly_budget:c.monthly_budget}); }
  });
  const txs = L.transactions.map(t => ({id:uid(), type:t.type, account_id:idm[t.account_id], to_account_id:t.to_account_id?idm[t.to_account_id]:null,
    category_id:t.category_id?(idm[t.category_id]||null):null, amount:t.amount, is_necessary:t.is_necessary, date:t.date,
    description:t.description, notes:t.notes, tags:t.tags||[]}));
  try {
    for (const [tb,rows] of [['accounts',accs],['categories',cats],['transactions',txs]]){
      if (!rows.length) continue;
      const {error} = await sb.from(tb).insert(rows); if (error) throw error;
    }
    localStorage.setItem('hub_imported','1'); await load(); render(); toast('Importazione completata');
  } catch (e) { toast('Importazione fallita: ' + e.message); }
}

/* Riconciliazione: crea una transazione di rettifica (tag "rettifica") pari alla differenza */
function reconc(id){
  const a = acc(id);
  if (a.type === 'investment') return toast('Per gli investimenti conta solo quanto hai versato: usa un trasferimento.');
  modal(`<h3 class="font-semibold mb-1">Riconcilia «${esc(a.name)}»</h3>
    <p class="text-sm text-slate-400 mb-4">Saldo calcolato: <b class="text-slate-100">${eur(balance(a))}</b>. Inserisci il saldo reale: verrà creata una rettifica per la differenza.</p>
    <form id="rf" class="space-y-3"><input name="real" inputmode="decimal" placeholder="Saldo reale (€)" class="${IN}" required>
    <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">Riconcilia</button></div></form>`);
  $('#rf').onsubmit = e => {
    e.preventDefault();
    const real = parseFloat(new FormData(e.target).get('real').replace(',','.'));
    if (isNaN(real)) return toast('Importo non valido');
    const diff = real - balance(a);
    if (Math.abs(diff) < 0.005){ closeModal(); return toast('Il saldo coincide già'); }
    // Il database richiede una categoria per ogni movimento che non sia un trasferimento:
    // si usa (o si crea) la categoria «Rettifica saldo» del tipo giusto. Le rettifiche restano escluse dai KPI (tag "rettifica").
    const ctype = diff > 0 ? 'income' : 'expense';
    let rc = S.categories.find(c => c.name === 'Rettifica saldo' && c.type === ctype);
    if (!rc){ rc = {name:'Rettifica saldo', type:ctype, icon:'scale', color:'#64748b', monthly_budget:null}; ins('categories', rc); }
    ins('transactions', {type:ctype, account_id:id, to_account_id:null, category_id:rc.id,
      amount:+Math.abs(diff).toFixed(2), is_necessary:null, date:today(), description:'Rettifica saldo', notes:null, tags:['rettifica']});
    closeModal(); render();
  };
}

// Totali di un mese per il grafico dell'andamento (rettifiche escluse, rimborsi sottratti alle uscite)
function monthSummary(key){
  const ms = S.transactions.filter(t => t.date.startsWith(key) && !(t.tags||[]).includes('rettifica'));
  const sum = f => ms.filter(f).reduce((s,t) => s + +t.amount, 0);
  const inc = sum(t => t.type==='income'), spese = sum(t => t.type==='expense') - sum(t => t.type==='refund');
  return {inc, spese, risp: inc - spese};
}
/* ===================== BUDGET MENSILE (stile 50/30/20, percentuali scelte dall'utente) ===================== */
const BUDGET_DEFAULT = {needs_pct:50, wants_pct:30, savings_pct:20, expected_income:null};
const budgetCfg = () => ({...BUDGET_DEFAULT, ...((S.budget_settings || [])[0] || {})});
function budgetCard(inc, nec, cas, risp, rf){
  const c = budgetCfg(), exp = +c.expected_income > 0 ? +c.expected_income : 0;
  const base = exp > 0 ? exp : inc, basis = exp > 0 ? 'entrata mensile prevista' : 'entrate del mese';
  const head = `<div class="flex items-center justify-between gap-2 mb-3"><h2 class="font-semibold">Budget del mese <span class="font-normal text-slate-500">· ${+c.needs_pct}/${+c.wants_pct}/${+c.savings_pct}</span></h2>
    <button class="${B2}" onclick="budgetForm()">Modifica</button></div>`;
  if (!(base > 0)) return `<div class="${CARD} mt-3">${head}<p class="text-sm text-slate-400">Nessuna entrata registrata in questo mese. Registra lo stipendio, oppure imposta da «Modifica» una <b class="text-slate-200">entrata mensile prevista</b>: vedrai subito quanto puoi spendere.</p></div>`;
  const pct = v => (v / base * 100).toFixed(0) + '%';
  // limite di spesa (Necessità, Casuale): barra che si riempie, rossa se superi
  const limit = (name, spent, p) => { const target = base * p / 100, ratio = target > 0 ? spent / target : (spent > 0 ? 2 : 0), over = ratio > 1;
    return `<div><div class="flex items-baseline justify-between gap-2 text-sm"><span>${name} <span class="text-xs text-slate-500">obiettivo ${p}% · reale ${pct(spent)}</span></span>
      <span class="tabular shrink-0">${eur(spent)} <span class="text-xs text-slate-500">/ ${eur(target)}</span></span></div>
      <div class="h-2 rounded-full bg-slate-800 mt-1"><div class="h-2 rounded-full ${over?'bg-red-400':'bg-mint'}" style="width:${Math.min(100, ratio*100)}%"></div></div>
      <div class="text-[11px] mt-0.5 ${over?'text-red-400':'text-slate-500'}">${over ? 'Superato di ' + eur(spent - target) : 'Ti restano ' + eur(target - spent)}</div></div>`; };
  // obiettivo di risparmio: barra che si riempie verso la meta
  const sp = +c.savings_pct, sTarget = base * sp / 100, sRatio = sTarget > 0 ? risp / sTarget : (risp > 0 ? 1 : 0), reached = risp >= sTarget && sTarget > 0 || (sTarget === 0 && risp >= 0);
  const saving = `<div><div class="flex items-baseline justify-between gap-2 text-sm"><span>Risparmio <span class="text-xs text-slate-500">obiettivo ${sp}% · reale ${pct(risp)}</span></span>
      <span class="tabular shrink-0 ${risp<0?'text-red-400':''}">${eur(risp)} <span class="text-xs text-slate-500">/ ${eur(sTarget)}</span></span></div>
      <div class="h-2 rounded-full bg-slate-800 mt-1"><div class="h-2 rounded-full ${reached?'bg-mint':risp<0?'bg-red-400':'bg-amber-400'}" style="width:${Math.max(0, Math.min(100, sRatio*100))}%"></div></div>
      <div class="text-[11px] mt-0.5 ${reached?'text-mint':risp<0?'text-red-400':'text-slate-500'}">${reached ? 'Obiettivo raggiunto' : risp < 0 ? 'Stai spendendo più di quanto entra' : 'Mancano ' + eur(sTarget - risp)}</div></div>`;
  return `<div class="${CARD} mt-3">${head}<div class="space-y-4">${limit('Necessità', nec, +c.needs_pct)}${limit('Casuale', cas, +c.wants_pct)}${saving}</div>
    <p class="text-xs text-slate-500 mt-3">Calcolato su ${basis}: ${eur(base)}.${rf > 0 ? ' I rimborsi riducono le uscite totali e aumentano il risparmio.' : ''}</p></div>`;
}
const BUDGET_PRESETS = [[50,30,20],[60,20,20],[70,20,10],[80,10,10]];

    if (cur) upd('budget_settings', cur.id, patch); else ins('budget_settings', patch);

function viewAn(){

      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => { const t = tr[c.dataIndex];
        return [`Risparmio: ${eur(t.risp)}`, `Entrate: ${eur(t.inc)}`, `Uscite: ${eur(t.spese)}`, `Tasso: ${rateOf(t)}`]; }}}},
      scales:{x:{grid:{display:false}}, y:{grid:{color:c => c.tick.value === 0 ? '#475569' : '#1e293b'}, ticks:{callback:v => Math.abs(v) >= 1000 ? (v/1000) + 'k' : v}}}}});
}

/* ===================== TAB 4 · PATRIMONIO ===================== */
// Liquidità e capitale investito a fine mese, ricalcolati dai movimenti (nessun compito automatico sul server).
// Gli investimenti sono contati al capitale versato: niente plusvalenze non realizzate.
const P = {range:12, serie:'tot', open:false};
const SER = {tot:{label:'Totale', color:'#a3e635'}, liq:{label:'Liquidità', color:'#818cf8'}, inv:{label:'Investito', color:'#f59e0b'}};
const LIQ_TYPES = ['cash','savings','card'];
const eur0 = n => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const setPat = (k,v) => { P[k] = v; viewPat(); };
function wealthSeries(range){
  const now = new Date(), cur = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const firsts = S.transactions.map(t => t.date.slice(0,7)).concat(S.accounts.filter(a => a.created_at).map(a => a.created_at.slice(0,7))).sort();
  const start = firsts[0] || cur, pts = [];
  for (let i = range - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1), key = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    if (key < start) continue;                                     // niente mesi prima dell'inizio dei dati
    const at = key === cur ? null : key, sumT = f => S.accounts.filter(f).reduce((s,a) => s + balanceAt(a, at), 0);
    const liq = sumT(a => LIQ_TYPES.includes(a.type)), inv = sumT(a => a.type === 'investment');
    pts.push({key, label:MESI[d.getMonth()].slice(0,3) + ' ' + String(d.getFullYear()).slice(2), liq, inv, tot:liq + inv});
  }
  return pts;
}
// Etichette con l'importo solo su primo, ultimo, minimo e massimo (gli altri valori restano al tocco)
const wealthLabels = {id:'wealthLabels', afterDatasetsDraw(ch){
  const vals = ch.data.datasets[0].data, meta = ch.getDatasetMeta(0), ctx = ch.ctx;
  if (!vals.length) return;
  const idx = [...new Set([0, vals.length-1, vals.indexOf(Math.max(...vals)), vals.indexOf(Math.min(...vals))])];
  ctx.save(); ctx.fillStyle = '#cbd5e1'; ctx.font = '11px system-ui, sans-serif';
  idx.forEach(i => { const p = meta.data[i]; if (!p) return;
    ctx.textAlign = i === 0 ? 'left' : i === vals.length-1 ? 'right' : 'center';
    ctx.fillText(eur0(vals[i]), p.x, p.y - 10); });
  ctx.restore(); }};
function viewPat(){
  const pts = wealthSeries(P.range), last = pts.length - 1;
  const bt = f => S.accounts.filter(f).reduce((s,a) => s + balance(a), 0);
  const liq = bt(a => LIQ_TYPES.includes(a.type)), inv = bt(a => a.type === 'investment'), tot = liq + inv;
  const delta = pts.length > 1 ? pts[last].tot - pts[last-1].tot : null;
  const share = tot > 0 ? Math.max(0, Math.min(100, liq / tot * 100)) : 0;
  const card = (l,v,sub,hi,cls='') => `<div class="rounded-2xl p-4 border ${hi?'bg-mint/10 border-mint/50':'bg-surf border-white/10'} ${cls}">
    <div class="text-xs ${hi?'text-mint':'text-slate-400'}">${l}</div><div class="mt-1 text-xl font-semibold tabular ${hi?'text-mint':''}">${eur(v)}</div>
    <div class="text-[11px] ${hi?'text-slate-400':'text-slate-500'}">${sub}</div></div>`;
  const chips = (opts, cur, fn, cls) => `<div class="grid ${cls} gap-1 rounded-xl bg-bg p-1">${opts.map(([k,l]) =>
    `<button type="button" onclick="${fn}(${typeof k==='number'?k:`'${k}'`})" class="rounded-lg py-1.5 text-xs font-medium ${String(k)===String(cur)?SEG_ON:SEG_OFF}">${l}</button>`).join('')}</div>`;
  const tRows = pts.map((x,i) => { const d = i > 0 ? x.tot - pts[i-1].tot : null, sel = i === last;
    return `<tr class="${sel?'bg-mint/10':''}"><td class="py-1.5 pl-2 ${sel?'font-medium text-mint':'text-slate-300'}">${x.label}</td>
      <td class="text-right tabular">${eur0(x.liq)}</td><td class="text-right tabular">${eur0(x.inv)}</td><td class="text-right tabular">${eur0(x.tot)}</td>
      <td class="text-right tabular pr-2 ${d===null?'text-slate-600':d>=0?'text-mint':'text-red-400'}">${d===null?'–':(d>=0?'+':'−')+eur0(Math.abs(d))}</td></tr>`; }).join('');
  $('#view').innerHTML = `
    <h1 class="text-xl font-semibold mb-4">Patrimonio</h1>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      ${card('Patrimonio', tot, delta === null ? 'liquidità + capitale investito' : `${delta>=0?'+':'−'}${eur0(Math.abs(delta))} rispetto al mese scorso`, true, 'col-span-2 md:col-span-1')}
      ${card('Liquidità', liq, 'contanti, carte e risparmio')}${card('Investito', inv, 'capitale versato, senza plusvalenze')}</div>
    ${tot > 0 ? `<div class="${CARD} mt-3"><div class="flex justify-between text-xs text-slate-400 mb-2"><span>Liquidità ${share.toFixed(0)}%</span><span>Investito ${(100-share).toFixed(0)}%</span></div>
      <div class="h-2.5 rounded-full bg-amber-400/40 overflow-hidden"><div class="h-2.5 bg-indigo-400" style="width:${share}%"></div></div></div>` : ''}
    <div class="${CARD} mt-3"><h2 class="font-semibold mb-3">Andamento a fine mese</h2>
      <div class="grid grid-cols-2 gap-2 mb-3">${chips(Object.entries(SER).map(([k,v]) => [k,v.label]), P.serie, 'setPat', 'grid-cols-3')}${chips([[6,'6 mesi'],[12,'12 mesi'],[24,'24 mesi']], P.range, 'setPat', 'grid-cols-3')}</div>
      ${pts.length >= 2 ? '<div class="h-56"><canvas id="ch3"></canvas></div>' : '<p class="text-sm text-slate-400 py-6 text-center">Servono almeno due mesi di dati per vedere l\'andamento.</p>'}
      ${pts.length ? `<button class="${B2} w-full mt-3" onclick="setPat('open',${!P.open})">${P.open?'Nascondi valori':'Mostra valori'}</button>` : ''}
      ${P.open && pts.length ? `<div class="overflow-x-auto mt-3"><table class="w-full text-xs"><thead><tr class="text-slate-500"><th class="text-left font-normal py-1 pl-2">Mese</th><th class="text-right font-normal">Liquidità</th><th class="text-right font-normal">Investito</th><th class="text-right font-normal">Totale</th><th class="text-right font-normal pr-2">Variaz.</th></tr></thead>
        <tbody class="divide-y divide-white/10">${tRows}</tbody></table></div>` : ''}</div>`;
  if (chart3){ chart3.destroy(); chart3 = null; }
  if (pts.length >= 2){
    Chart.defaults.color = '#94a3b8';
    const sr = SER[P.serie];
    chart3 = new Chart($('#ch3'), {type:'line', plugins:[wealthLabels],
      data:{labels:pts.map(x => x.label), datasets:[{label:sr.label, data:pts.map(x => x[P.serie]), borderColor:sr.color, tension:.3, borderWidth:2,
        pointRadius:c => c.dataIndex === last ? 6 : 3, pointBackgroundColor:c => c.dataIndex === last ? sr.color : '#111827', pointBorderColor:sr.color, pointBorderWidth:2}]},
      options:{maintainAspectRatio:false, layout:{padding:{top:22, right:12, left:4}}, interaction:{mode:'index', intersect:false},
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => { const x = pts[c.dataIndex]; return [`Totale: ${eur0(x.tot)}`, `Liquidità: ${eur0(x.liq)}`, `Investito: ${eur0(x.inv)}`]; }}}},
        scales:{x:{grid:{display:false}}, y:{grid:{color:'#1e293b'}, ticks:{callback:v => Math.abs(v) >= 1000 ? (v/1000) + 'k' : v}}}}});
  }
}

/* ===================== TAB 5 · OBIETTIVI ===================== */
// Accantonamenti: i soldi restano sui conti veri, l'obiettivo è una quota «messa da parte».
// Messo da parte = somma dei movimenti dell'obiettivo (+ versamenti, - prelievi/spese).
const GOAL_PRESETS = [['Fondo di emergenza','lifeRing','#a3e635'],['Vacanza','beach','#38bdf8'],['Auto','car','#818cf8'],['Casa','home','#f59e0b'],['Regalo','gift','#f472b6']];
const GOAL_ICONS = ['lifeRing','beach','car','home','graduation','ring','gift','laptop','phone','plane','tree','dog','target','coins'];
const ENTRY_LBL = {deposit:'Versamento', withdraw:'Prelievo', spend:'Spesa'};
let goalCharts = [];
const goal = id => S.goals.find(g => g.id === id);
const goalSaved = g => S.goal_entries.filter(e => e.goal_id === g.id).reduce((s,e) => s + +e.amount, 0);
const liquidity = () => S.accounts.filter(a => LIQ_TYPES.includes(a.type)).reduce((s,a) => s + balance(a), 0);
const allocated = () => S.goals.reduce((s,g) => s + goalSaved(g), 0);
const dmy = d => String(d).split('-').reverse().join('/');
// media mensile delle spese di Necessità degli ultimi 3 mesi (per suggerire la dimensione del fondo di emergenza)
function avgNeeds(){
  const now = new Date(), keys = [0,1,2].map(i => { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; });
  const tot = S.transactions.filter(t => t.type === 'expense' && t.is_necessary && !(t.tags||[]).includes('rettifica') && keys.some(k => t.date.startsWith(k))).reduce((s,t) => s + +t.amount, 0);
  return tot / 3;
}
const centerText = {id:'centerText', afterDraw(ch){
  const t = ch.options.plugins && ch.options.plugins.centerText && ch.options.plugins.centerText.text; if (!t) return;
  const {ctx, chartArea:a} = ch; ctx.save(); ctx.fillStyle = '#e2e8f0'; ctx.font = '600 15px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, (a.left + a.right) / 2, (a.top + a.bottom) / 2); ctx.restore(); }};

function goalCard(g){
  const saved = goalSaved(g), target = +g.target_amount, pct = target > 0 ? saved / target * 100 : 0, done = saved >= target - 0.005, rest = Math.max(0, target - saved);
  let dl = '';
  if (g.target_date && !done){
    const days = Math.ceil((new Date(g.target_date + 'T00:00') - new Date(today() + 'T00:00')) / 864e5);
    dl = days < 0 ? `<div class="text-[11px] text-red-400">Scaduto il ${dmy(g.target_date)}</div>`
                  : `<div class="text-[11px] text-slate-400">Entro il ${dmy(g.target_date)}: ${eur(rest / Math.max(1, Math.ceil(days / 30.44)))} al mese</div>`;
  }
  return `<div class="${CARD}">
    <div class="flex items-center gap-4">
      <div class="relative h-28 w-28 shrink-0"><canvas id="gc-${g.id}"></canvas></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">${iconSvg(g.icon||'target','h-5 w-5 text-mint')}<h3 class="font-semibold truncate">${esc(g.name)}</h3></div>
        <div class="mt-1 text-xl font-semibold tabular">${eur(saved)}</div>
        <div class="text-xs text-slate-500">di ${eur(target)}</div>
        <div class="text-xs mt-1 ${done?'text-mint':'text-slate-400'}">${done ? (saved > target + 0.005 ? 'Raggiunto, ' + eur(saved - target) + ' oltre' : 'Obiettivo raggiunto') : 'Mancano ' + eur(rest)}</div>
        ${dl}</div></div>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <button class="${B1} !py-2 !text-xs" onclick="moneyForm('${g.id}','deposit')">Aggiungi</button>
      <button class="${B2}" onclick="moneyForm('${g.id}','withdraw')">Preleva</button>
      <button class="${B2}" onclick="spendForm('${g.id}')">Usa fondi</button></div>
    <button class="mt-2 w-full text-xs text-slate-500 hover:text-mint" onclick="goalDetail('${g.id}')">Storico e modifica</button></div>`;
}
function viewGoals(){
  goalCharts.forEach(c => c.destroy()); goalCharts = [];
  const head = `<div class="flex items-center justify-between mb-4"><h1 class="text-xl font-semibold">Obiettivi</h1><button class="${B1} !py-2" onclick="goalForm()">+ Nuovo</button></div>`;
  if (!goalsReady){
    $('#view').innerHTML = head + `<div class="${CARD} text-sm text-slate-300 space-y-2"><p>Per usare gli obiettivi serve creare le tabelle su Supabase, una volta sola.</p>
      <p class="text-slate-400">Apri l'SQL Editor di Supabase, premi «New query», incolla il contenuto del file <b class="text-slate-200">migration_goals.sql</b>, premi Run e poi ricarica questa pagina.</p></div>`;
    return;
  }
  const liq = liquidity(), alloc = allocated(), free = liq - alloc;
  const k = (l,v,cls='') => `<div class="${CARD} !p-3"><div class="text-[11px] text-slate-400">${l}</div><div class="mt-0.5 text-base font-semibold tabular ${cls}">${eur(v)}</div></div>`;
  const warn = alloc > liq + 0.005 ? `<div class="mt-3 rounded-xl border border-red-400/40 bg-red-400/10 p-3 text-sm text-red-300">Hai messo da parte ${eur(alloc)} negli obiettivi, ma la liquidità è ${eur(liq)}: ${eur(alloc - liq)} non sono coperti.
    Se hai speso soldi accantonati, usa «Preleva» sull'obiettivo per riallinearlo.</div>` : '';
  const empty = `<div class="${CARD} text-center py-8"><div class="mb-2 flex justify-center text-mint">${iconSvg('target','h-8 w-8')}</div><p class="font-medium">Nessun obiettivo ancora</p>
    <p class="text-sm text-slate-400 mt-1 mb-4">Metti da parte soldi per qualcosa di preciso: un fondo di emergenza, una vacanza, un acquisto.</p>
    <div class="flex flex-wrap justify-center gap-2">${GOAL_PRESETS.map(p => `<button class="${B2}" onclick="goalForm(null,'${p[0]}')">${iconSvg(p[1],'h-4 w-4')} ${esc(p[0])}</button>`).join('')}</div></div>`;
  $('#view').innerHTML = head + (S.goals.length ? `<div class="grid grid-cols-3 gap-3">${k('Messo da parte', alloc)}${k('Liquidità', liq)}${k('Libera', free, free < 0 ? 'text-red-400' : 'text-mint')}</div>${warn}
    <div class="grid md:grid-cols-2 gap-3 mt-3">${S.goals.map(goalCard).join('')}</div>` : empty);
  Chart.defaults.color = '#94a3b8';
  S.goals.forEach(g => {
    const saved = goalSaved(g), target = +g.target_amount, filled = Math.max(0, Math.min(saved, target));
    goalCharts.push(new Chart(document.getElementById('gc-' + g.id), {type:'doughnut', plugins:[centerText],
      data:{labels:['Messo da parte','Mancante'], datasets:[{data:[filled, Math.max(0, target - filled)], backgroundColor:[g.color || '#a3e635', '#1e293b'], borderColor:'#111827', borderWidth:2}]},
      options:{cutout:'72%', maintainAspectRatio:false, plugins:{legend:{display:false}, centerText:{text:Math.round(target > 0 ? saved / target * 100 : 0) + '%'},
        tooltip:{callbacks:{label:c => `${c.label}: ${eur(c.parsed)}`}}}}}));
  });
}

function chooseGoalIcon(value){ const el=$('#gicon'); if(el) el.value=value; }
/* Nuovo / modifica obiettivo */
function goalForm(editId = null, preset = null){
  const g = editId ? goal(editId) : null, p = preset ? GOAL_PRESETS.find(x => x[0] === preset) : null;
  const v = g || (p ? {name:p[0], icon:p[1], color:p[2]} : {});
  const goalIconButtons = GOAL_ICONS.map(k=>'<button type="button" onclick="chooseGoalIcon(\''+k+'\')" class="flex h-9 w-9 items-center justify-center rounded-lg text-mint hover:bg-white/10" aria-label="Scegli icona '+ICON_NAMES[k]+'">'+iconSvg(k,'h-5 w-5')+'</button>').join('');
  modal(`<h3 class="font-semibold mb-3">${g ? 'Modifica obiettivo' : 'Nuovo obiettivo'}</h3>
    ${g ? '' : `<div class="flex flex-wrap gap-2 mb-3">${GOAL_PRESETS.map(x => `<button type="button" class="${B2}" onclick="goalForm(null,'${x[0]}')">${iconSvg(x[1],'h-4 w-4')} ${esc(x[0])}</button>`).join('')}</div>`}
    <form id="gf" class="space-y-3">
      <input name="name" placeholder="Nome (es. Vacanza in Giappone)" required value="${esc(v.name || '')}" oninput="goalHint()" class="${IN}">
      <div><label class="text-xs text-slate-400">Importo da raggiungere (€)</label>
        <input name="target" inputmode="decimal" required placeholder="0,00" value="${g ? String(g.target_amount).replace('.', ',') : ''}" class="${IN}"><p id="ghint" class="text-xs text-slate-500 mt-1"></p></div>
      ${g ? '' : `<div><label class="text-xs text-slate-400">Già messi da parte (€, facoltativo)</label><input name="initial" inputmode="decimal" placeholder="0,00" class="${IN}"></div>`}
      <div><label class="text-xs text-slate-400">Scadenza (facoltativa)</label><input type="date" name="date" value="${g?.target_date || ''}" class="${IN}"></div>
      <div><label class="text-xs text-slate-400">Icona</label><input type="hidden" name="icon" id="gicon" value="${iconKey(v.icon,'target')}">
        <div class="mt-2 flex flex-wrap gap-1">${goalIconButtons}</div></div>
      <div class="flex items-center justify-between text-sm text-slate-400"><span>Colore</span>
        <input type="color" name="color" value="${v.color || '#a3e635'}" class="h-9 w-14 cursor-pointer rounded-lg border border-white/10 bg-bg p-0.5"></div>
      <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button>
        ${g ? `<button type="button" class="${B2} flex-1 !text-red-400" onclick="removeGoal('${g.id}')">Elimina</button>` : ''}<button class="${B1} flex-1">${g ? 'Salva' : 'Crea'}</button></div></form>`);
  goalHint();
  $('#gf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), num = x => { const n = parseFloat(String(x || '').replace(',', '.')); return isNaN(n) ? 0 : n; };
    const target = num(f.get('target')); if (!(target > 0)) return toast('Importo non valido');
    const row = {name:f.get('name').trim(), target_amount:target, icon:(f.get('icon') || '').trim() || 'target', color:f.get('color'), target_date:f.get('date') || null};
    if (g) upd('goals', g.id, row);
    else {
      ins('goals', row);
      const init = num(f.get('initial'));
      if (init > 0) ins('goal_entries', {goal_id:row.id, amount:init, kind:'deposit', date:today(), note:'Importo iniziale', transaction_id:null});
    }
    closeModal(); render();
  };
}
// Suggerimento per il fondo di emergenza: 3-6 mesi di spese di Necessità
function goalHint(){
  const el = $('#ghint'), f = $('#gf'); if (!el || !f) return;
  const a = avgNeeds();
  el.textContent = /emergenza/i.test(f.elements.name.value) && a > 0 ? `Un fondo di emergenza copre di solito 3-6 mesi di spese di Necessità: per te circa ${eur0(a * 3)} - ${eur0(a * 6)} (media degli ultimi 3 mesi).` : '';
}
function removeGoal(id){
  const g = goal(id); if (!g || !confirm(`Eliminare l'obiettivo «${g.name}» e il suo storico? I soldi restano sui tuoi conti.`)) return;
  S.goal_entries = S.goal_entries.filter(e => e.goal_id !== id);
  del('goals', id); closeModal();
}

/* Aggiungi / Preleva */
function moneyForm(id, kind){
  const g = goal(id), saved = goalSaved(g), free = liquidity() - allocated(), dep = kind === 'deposit';
  modal(`<h3 class="font-semibold mb-1">${dep ? 'Aggiungi a' : 'Preleva da'} «${esc(g.name)}»</h3>
    <p class="text-sm text-slate-400 mb-3">${dep ? `Liquidità non ancora assegnata: <b class="text-slate-200">${eur(free)}</b>. I soldi restano sui tuoi conti.` : `Disponibile nell'obiettivo: <b class="text-slate-200">${eur(saved)}</b>. Il saldo dei conti non cambia.`}</p>
    <form id="mf" class="space-y-3"><div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-slate-400">Importo (€)</label><input name="amount" inputmode="decimal" required placeholder="0,00" class="${IN}"></div>
      <div><label class="text-xs text-slate-400">Data</label><input type="date" name="date" value="${today()}" required class="${IN}"></div></div>
      <input name="note" placeholder="Nota (facoltativa)" class="${IN}">
      <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">${dep ? 'Aggiungi' : 'Preleva'}</button></div></form>`);
  $('#mf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), amt = parseFloat(String(f.get('amount')).replace(',', '.'));
    if (!(amt > 0)) return toast('Importo non valido');
    if (!dep && amt > saved + 0.005) return toast('Non puoi prelevare più di quanto hai messo da parte');
    if (dep && amt > free + 0.005 && !confirm(`Stai mettendo da parte più della liquidità libera (${eur(free)}). Continuare?`)) return;
    ins('goal_entries', {goal_id:id, amount:dep ? amt : -amt, kind:kind, date:f.get('date'), note:f.get('note') || null, transaction_id:null});
    closeModal(); render();
  };
}

/* Usa fondi: registra la spesa vera in Transazioni e scala la stessa cifra dall'obiettivo */
function spendForm(id){
  const g = goal(id), saved = goalSaved(g), accs = S.accounts.filter(a => LIQ_TYPES.includes(a.type)), cats = S.categories.filter(c => c.type === 'expense');
  if (!accs.length || !cats.length) return toast('Servono almeno un conto e una categoria di uscita');
  const needs = /emergenza/i.test(g.name);
  const best = accs.reduce((a,b) => balance(b) > balance(a) ? b : a);        // conto preselezionato: quello con più soldi
  modal(`<h3 class="font-semibold mb-1">Usa fondi di «${esc(g.name)}»</h3>
    <p class="text-sm text-slate-400 mb-3">Registra la spesa vera in Transazioni e scala la stessa cifra dall'obiettivo (disponibile: <b class="text-slate-200">${eur(saved)}</b>).</p>
    <form id="sf" class="space-y-3"><div class="grid grid-cols-2 gap-3">
      <div><label class="text-xs text-slate-400">Importo speso (€)</label><input name="amount" inputmode="decimal" required value="${String(saved.toFixed(2)).replace('.', ',')}" class="${IN}"></div>
      <div><label class="text-xs text-slate-400">Data</label><input type="date" name="date" value="${today()}" required class="${IN}"></div></div>
      <div><label class="text-xs text-slate-400">Pagato dal conto</label><select name="account_id" class="${IN}">${accs.map(a => `<option value="${a.id}" ${a.id===best.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div><label class="text-xs text-slate-400">Categoria</label><select name="category_id" required class="${IN}">${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div><label class="text-xs text-slate-400">Tipo di spesa</label><select name="is_necessary" class="${IN}"><option value="1" ${needs?'selected':''}>Necessità</option><option value="0" ${needs?'':'selected'}>Casuale</option></select></div>
      <input name="description" value="${esc(g.name)}" placeholder="Descrizione" class="${IN}">
      <div class="flex gap-2"><button type="button" class="${B2} flex-1" onclick="closeModal()">Annulla</button><button class="${B1} flex-1">Registra spesa</button></div></form>`);
  $('#sf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target), amt = parseFloat(String(f.get('amount')).replace(',', '.'));
    if (!(amt > 0)) return toast('Importo non valido');
    const tx = {type:'expense', account_id:f.get('account_id'), to_account_id:null, category_id:f.get('category_id'), amount:amt, is_necessary:f.get('is_necessary') === '1',
      date:f.get('date'), description:f.get('description') || g.name, notes:null, tags:['obiettivo']};
    ins('transactions', tx);
    const scaled = Math.min(amt, saved);                    // se spendi più di quanto accantonato, scala solo quanto c'era
    if (scaled > 0) ins('goal_entries', {goal_id:id, amount:-scaled, kind:'spend', date:tx.date, note:tx.description, transaction_id:tx.id});
    closeModal(); render();
    if (amt > saved + 0.005) toast('Spesa registrata: dall\'obiettivo ho scalato ' + eur(scaled));
  };
}

/* Storico e modifica */
function goalDetail(id){
  const g = goal(id), saved = goalSaved(g);
  const entries = S.goal_entries.filter(e => e.goal_id === id).sort((a,b) => b.date.localeCompare(a.date) || (b.created_at||'').localeCompare(a.created_at||''));
  modal(`<div class="flex items-center gap-2 mb-1">${iconSvg(g.icon||'target','h-5 w-5 text-mint')}<h3 class="font-semibold truncate">${esc(g.name)}</h3></div>
    <p class="text-sm text-slate-400 mb-3">${eur(saved)} messi da parte su ${eur(+g.target_amount)}</p>
    <div class="rounded-xl border border-white/10 divide-y divide-white/10 max-h-64 overflow-y-auto">${entries.map(e => `<div class="flex items-center gap-2 px-3 py-2 text-sm">
      <div class="flex-1 min-w-0"><div>${ENTRY_LBL[e.kind] || 'Movimento'}${e.note ? ` <span class="text-xs text-slate-500">· ${esc(e.note)}</span>` : ''}</div><div class="text-xs text-slate-500">${dmy(e.date)}</div></div>
      <span class="tabular font-medium ${+e.amount < 0 ? 'text-slate-300' : 'text-mint'}">${+e.amount < 0 ? '−' : '+'}${eur(Math.abs(+e.amount))}</span>
      <button class="text-xs text-slate-500 hover:text-red-400" onclick="delEntry('${e.id}')">Elimina</button></div>`).join('') || '<p class="p-4 text-sm text-slate-500 text-center">Nessun movimento.</p>'}</div>
    <p class="text-xs text-slate-500 mt-2">Eliminare un movimento non modifica le transazioni dei tuoi conti.</p>
    <div class="flex gap-2 mt-4"><button class="${B2} flex-1" onclick="closeModal()">Chiudi</button><button class="${B1} flex-1" onclick="goalForm('${id}')">Modifica obiettivo</button></div>`);
}
function delEntry(id){ if (confirm('Eliminare questo movimento dall\'obiettivo?')){ del('goal_entries', id); closeModal(); } }

/* ===================== AVVIO ===================== */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===================== LOGIN & AVVIO ===================== */
function showAuth(){
  const a = $('#auth'); a.classList.remove('hidden'); a.classList.add('flex');
  a.innerHTML = `<form id="af" class="w-full max-w-sm space-y-3"><div class="flex items-center gap-3 text-2xl font-semibold"><img src="finance-app-icon-192.jpg" alt="" class="h-12 w-12 rounded-xl object-cover">Finance App</div>
    <p class="text-sm text-slate-400">Accedi: i tuoi dati si sincronizzano su tutti i dispositivi.</p>
    <input name="email" type="email" autocomplete="email" placeholder="Email" required class="${IN}">
    <input name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Password" required class="${IN}">
    <p id="diag" class="text-xs text-slate-500">Verifica collegamento a Supabase… · versione ${APP_VERSION}</p>
    <p id="amsg" class="hidden text-sm text-mint leading-relaxed"></p>
    <button class="${B1} w-full">Accedi</button><button type="button" id="su" class="${B2} w-full">Crea account</button></form>`;
  // Diagnostica: dice subito se questo browser riesce a raggiungere Supabase (e mostra la versione del file)
  const dg = $('#diag'), host = new URL(SUPABASE_URL).host;
  fetch(SUPABASE_URL + '/auth/v1/health', {headers:{apikey:SUPABASE_ANON_KEY}})
    .then(r => { dg.textContent = `Collegamento a ${host}: ${r.ok ? 'OK' : 'risposta inattesa (' + r.status + ')'} · versione ${APP_VERSION}`; dg.className = 'text-xs ' + (r.ok ? 'text-mint' : 'text-amber-300'); })
    .catch(e => { dg.textContent = `Collegamento a ${host}: NON raggiungibile (${e.message}) · versione ${APP_VERSION}`; dg.className = 'text-xs text-red-400'; });
  const redirect = location.origin + location.pathname;      // il link nella mail riporta qui
  let lastEmail = '';
  const msg = (h, err) => { const m = $('#amsg'); m.innerHTML = h; m.className = 'text-sm leading-relaxed ' + (err ? 'text-red-400' : 'text-mint'); };
  const friendly = m => /anonymous sign-ins/i.test(m) ? 'Inserisci email e password (almeno 6 caratteri) prima di premere il pulsante.'
    : /rate limit/i.test(m) ? 'Troppe email inviate in poco tempo: Supabase ne permette pochissime all\'ora. Attendi un po\' (anche un\'ora) e riprova.'
    : /already registered|already been registered/i.test(m) ? 'Questa email è già registrata: premi Accedi.'
    : /signups? (not allowed|are disabled|disabled)/i.test(m) ? 'Le registrazioni sono disattivate su Supabase (Authentication → Sign In / Providers → "Allow new users to sign up").'
    : /invalid api key|apikey/i.test(m) ? 'Chiave Supabase non valida: controlla SUPABASE_ANON_KEY nel file.'
    : /password/i.test(m) ? 'Password non valida: ' + esc(m)
    : /failed to fetch|networkerror|load failed/i.test(m) ? 'Impossibile raggiungere Supabase. Controlla la connessione, che il progetto non sia in pausa e che nessun blocco (VPN, blocco pubblicità) lo impedisca.'
    : esc(m);
  window.resendMail = async () => {
    const {error} = await sb.auth.resend({type:'signup', email:lastEmail, options:{emailRedirectTo:redirect}});
    msg(error ? friendly(error.message) : 'Email inviata di nuovo. Controlla anche lo spam.', !!error);
  };
  const resendBtn = ' <button type="button" class="underline" onclick="resendMail()">Reinvia email</button>';
  const run = async signup => {
    if (!$('#af').reportValidity()) return;      // il pulsante 'Crea account' non controlla da solo i campi vuoti
    const f = new FormData($('#af')), cred = {email:f.get('email').trim(), password:f.get('password')};
    lastEmail = cred.email; msg('Attendi…');
    try {
      const {data,error} = signup ? await sb.auth.signUp({...cred, options:{emailRedirectTo:redirect}}) : await sb.auth.signInWithPassword(cred);
      if (error){
        if (/not confirmed/i.test(error.message)) return msg('Email non ancora confermata: apri il link nella mail che ti abbiamo inviato.' + resendBtn);
        return msg(friendly(error.message), true);
      }
      if (signup && data.user && data.user.identities && !data.user.identities.length) return msg('Questa email è già registrata: premi Accedi.', true);
      if (!data.session) return msg(`Ti abbiamo inviato una email di conferma a <b>${esc(cred.email)}</b>. Apri il link nella mail, poi torna qui e premi Accedi. Controlla anche lo spam.` + resendBtn);
      a.classList.add('hidden'); a.classList.remove('flex'); boot();
    } catch (e) { msg(friendly(String((e && e.message) || e)), true); }
  };
  $('#af').onsubmit = e => { e.preventDefault(); run(false); };
  $('#su').onclick = () => run(true);
}
async function boot(){
  if (!DEMO && typeof supabase === 'undefined')
    return showFatal('Libreria Supabase non caricata: controlla la connessione a Internet o blocchi del browser verso cdn.jsdelivr.net.');
  if (!DEMO){
    if (!sb){
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT'){ currentEmail=''; S = {accounts:[],categories:[],transactions:[],budget_settings:[],goals:[],goal_entries:[]}; showAuth(); } });
      // Al ritorno sull'app ricarica i dati (per vedere le modifiche fatte da un altro dispositivo)
      const sync = () => {
        const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
        if (!document.hidden && !typing && $('#modal').classList.contains('hidden')) Q = Q.then(load).then(render);
      };
      document.addEventListener('visibilitychange', sync);
      setInterval(sync, 15000);   // ricarica ogni 15 secondi mentre l'app è aperta
    }
    const {data:{session}} = await sb.auth.getSession();
    if (!session) return showAuth();
    currentEmail = session.user?.email || '';
  }
  await load(); render();
}
boot();
</script>
